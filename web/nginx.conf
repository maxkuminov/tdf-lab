# =============================================================================
#  Main nginx configuration for the tdf-lab-web image.
#
#  Built for a READ-ONLY root filesystem as uid 101: the pid file, every temp
#  path and the rendered site config live under /tmp (an emptyDir on
#  Kubernetes, a tmpfs under Compose), logs go to stdout/stderr, and nothing
#  under /etc or /usr is ever written. The server block is rendered at start
#  by web/entrypoint.sh from web/default.conf.template.
# =============================================================================
# Two workers: a static site and a small proxy. `auto` would start one per
# NODE cpu on Kubernetes, whatever the pod's limit.
worker_processes  2;
error_log  /dev/stderr notice;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    proxy_temp_path       /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /dev/stdout  main;

    sendfile           on;
    keepalive_timeout  65;
    server_tokens      off;

    include /tmp/tdf-lab/default.conf;
}
